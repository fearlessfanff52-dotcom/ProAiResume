<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumePro AI — Create ATS-Friendly Resumes in Minutes</title>
<meta name="description" content="ResumePro AI helps you build ATS-friendly, professional resumes in minutes with AI summaries, cover letters and real-time ATS scoring.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root[data-theme="dark"]{
  --bg:#090E22; --bg-alt:#0F1938; --bg-alt2:#0B1330;
  --card:rgba(255,255,255,0.055); --card-solid:#101B3E; --border:rgba(255,255,255,0.12);
  --text:#F3F6FF; --text-muted:#9AABD6; --text-faint:#6C7BAA;
  --accent:#4F7CFF; --accent2:#7AA6FF; --accent-soft:rgba(79,124,255,0.15);
  --success:#2ED8A0; --warn:#FBBF24; --danger:#FB7185;
  --resume-bg:#FFFFFF; --resume-text:#12183A;
  --shadow: 0 20px 60px -20px rgba(0,0,0,0.55);
}
:root[data-theme="light"]{
  --bg:#F3F6FD; --bg-alt:#FFFFFF; --bg-alt2:#EAF0FC;
  --card:rgba(15,25,60,0.045); --card-solid:#FFFFFF; --border:rgba(15,25,60,0.10);
  --text:#0B1330; --text-muted:#4A5578; --text-faint:#8592B4;
  --accent:#2F5CE0; --accent2:#4F7CFF; --accent-soft:rgba(47,92,224,0.10);
  --success:#0FA579; --warn:#B45309; --danger:#DC2626;
  --resume-bg:#FFFFFF; --resume-text:#12183A;
  --shadow: 0 20px 50px -25px rgba(20,30,70,0.25);
}
*{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',sans-serif; transition:background .35s ease, color .35s ease;
  overflow-x:hidden;
}
h1,h2,h3,h4,.font-display{font-family:'Sora',sans-serif;}
.font-mono{font-family:'JetBrains Mono',monospace;}
::selection{background:var(--accent); color:#fff;}
a{text-decoration:none; color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; background:var(--bg-alt2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 13px; font-size:14px; width:100%; outline:none; transition:border-color .2s, box-shadow .2s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
input::placeholder,textarea::placeholder{color:var(--text-faint);}
label{font-size:12.5px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:6px; letter-spacing:.01em;}
.container{max-width:1180px; margin:0 auto; padding:0 24px;}

/* ============ UTIL ============ */
.glass{background:var(--card); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); border:1px solid var(--border); box-shadow:var(--shadow);}
.card{background:var(--bg-alt); border:1px solid var(--border); border-radius:18px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:14.5px; padding:13px 24px; border-radius:12px; border:1px solid transparent; transition:transform .18s ease, box-shadow .18s ease, background .18s, border-color .18s; white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#7C5CFF); color:#fff; box-shadow:0 10px 30px -8px rgba(79,124,255,.6);}
.btn-primary:hover{box-shadow:0 14px 36px -6px rgba(79,124,255,.75); transform:translateY(-2px);}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--text);}
.btn-ghost:hover{border-color:var(--accent); color:var(--accent2);}
.btn-soft{background:var(--accent-soft); color:var(--accent2); border-color:transparent;}
.btn-soft:hover{background:var(--accent); color:#fff;}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:9px;}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important;}
.pill{display:inline-flex; align-items:center; gap:6px; padding:6px 13px; border-radius:99px; font-size:12.5px; font-weight:600; background:var(--card); border:1px solid var(--border); color:var(--text-muted);}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px; background:var(--accent-soft); color:var(--accent2); font-size:13px; font-weight:600;}
.section{padding:96px 0;}
.eyebrow{font-size:12.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent2);}
.muted{color:var(--text-muted);}
.grad-text{background:linear-gradient(100deg,#7AA6FF,#B79CFF 60%,#4F7CFF); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hidden{display:none !important;}
.icon{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}
.spin{animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes floaty{0%,100%{transform:translateY(0px);}50%{transform:translateY(-14px);}}
@keyframes fadeUp{from{opacity:0; transform:translateY(18px);}to{opacity:1; transform:translateY(0);}}
.reveal{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both;}
@keyframes shimmer{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 var(--accent-soft);}70%{box-shadow:0 0 0 14px rgba(0,0,0,0);}100%{box-shadow:0 0 0 0 rgba(0,0,0,0);}}
.scrollbar-thin::-webkit-scrollbar{width:7px; height:7px;}
.scrollbar-thin::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}

/* ============ NAV ============ */
#navbar{position:fixed; top:0; left:0; right:0; z-index:200; padding:14px 0; transition:background .3s,border-color .3s;}
#navbar.scrolled{background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(16px); border-bottom:1px solid var(--border);}
.nav-inner{display:flex; align-items:center; justify-content:space-between; max-width:1180px; margin:0 auto; padding:0 24px;}
.logo{display:flex; align-items:center; gap:9px; font-family:'Sora'; font-weight:700; font-size:19px;}
.logo-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,var(--accent),#7C5CFF); display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; font-weight:800;}
.nav-links{display:flex; align-items:center; gap:6px;}
.nav-link{padding:9px 14px; border-radius:9px; font-size:14px; font-weight:500; color:var(--text-muted); transition:background .2s,color .2s;}
.nav-link:hover,.nav-link.active{color:var(--text); background:var(--card);}
.theme-toggle{width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--text);}
.mobile-toggle{display:none;}
@media(max-width:900px){
  .nav-links{display:none;}
  .mobile-toggle{display:flex;}
}

/* ============ HERO ============ */
.hero-bg{position:relative; overflow:hidden; padding-top:150px; padding-bottom:90px;}
.hero-glow{position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; z-index:0; pointer-events:none;}
.trust-row{display:flex; flex-wrap:wrap; gap:28px; align-items:center;}
.mockup-wrap{position:relative;}
.mockup-card{border-radius:22px; overflow:hidden; transform:rotate(1.2deg); animation:floaty 6s ease-in-out infinite;}
.score-ring-badge{position:absolute; top:-22px; right:-18px; z-index:5;}
@media(max-width:1024px){.hero-grid{grid-template-columns:1fr !important;} .mockup-wrap{margin-top:40px;}}

/* ============ RESUME DOC (shared render, skinned per template) ============ */
.resume-doc{background:var(--resume-bg); color:var(--resume-text); border-radius:4px; padding:34px 38px; font-size:12.5px; line-height:1.5;}
.resume-doc h1.r-name{font-size:24px; margin:0 0 2px; letter-spacing:.01em;}
.resume-doc .r-title{font-size:13px; margin:0 0 8px; opacity:.85; font-weight:600;}
.resume-doc .r-contact{font-size:10.5px; opacity:.75; margin-bottom:0;}
.resume-doc .r-section-title{font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:800; margin:16px 0 7px; padding-bottom:4px;}
.resume-doc .r-entry{margin-bottom:9px;}
.resume-doc .r-entry-head{display:flex; justify-content:space-between; font-weight:700; font-size:12.5px;}
.resume-doc .r-entry-sub{display:flex; justify-content:space-between; font-size:11px; opacity:.7; font-style:italic; margin-bottom:3px;}
.resume-doc ul{margin:2px 0 0 16px; padding:0;}
.resume-doc li{margin-bottom:2px;}
.resume-doc .r-skills{display:flex; flex-wrap:wrap; gap:6px;}
.resume-doc .r-skill-chip{font-size:10.5px; padding:2px 9px; border-radius:20px;}
/* skin: modern */
.tmpl-modern .r-header{background:#12183A; color:#fff; margin:-34px -38px 16px; padding:26px 38px;}
.tmpl-modern .r-section-title{color:#12183A; border-bottom:2px solid #4F7CFF;}
.tmpl-modern .r-skill-chip{background:#EAF0FC; color:#12183A;}
.tmpl-modern{font-family:'Inter',sans-serif;}
/* skin: classic */
.tmpl-classic .r-header{text-align:center; border-bottom:2px solid #12183A; padding-bottom:10px; margin-bottom:12px;}
.tmpl-classic .r-name{text-transform:uppercase; letter-spacing:.06em;}
.tmpl-classic .r-section-title{text-align:center; border-top:1px solid #12183A; border-bottom:1px solid #12183A; padding:3px 0;}
.tmpl-classic .r-skill-chip{background:#fff; border:1px solid #12183A;}
.tmpl-classic{font-family:Georgia,'Times New Roman',serif;}
/* skin: minimal */
.tmpl-minimal .r-name{font-weight:600;}
.tmpl-minimal .r-section-title{color:#6C7BAA; font-weight:700; border:none;}
.tmpl-minimal .r-skill-chip{background:transparent; border:1px solid #D8DEEE; color:#12183A;}
.tmpl-minimal{font-family:'Inter',sans-serif;}
/* skin: executive */
.tmpl-executive .r-header{border-left:5px solid #12183A; padding-left:14px;}
.tmpl-executive .r-name{font-weight:800;}
.tmpl-executive .r-section-title{background:#12183A; color:#fff; padding:3px 10px; border-radius:2px; display:inline-block;}
.tmpl-executive .r-skill-chip{background:#12183A; color:#fff;}
.tmpl-executive{font-family:'Sora',sans-serif;}

/* ============ FEATURE / PRICING CARDS ============ */
.feat-card{padding:26px; border-radius:18px; transition:transform .25s ease, border-color .25s ease;}
.feat-card:hover{transform:translateY(-6px); border-color:var(--accent);}
.feat-icon{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent2); margin-bottom:16px;}
.price-card{border-radius:22px; padding:32px 28px; position:relative;}
.price-card.featured{border:1.5px solid var(--accent); background:linear-gradient(160deg,var(--accent-soft),transparent 60%);}
.badge-pop{position:absolute; top:-13px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,var(--accent),#7C5CFF); color:#fff; font-size:11.5px; font-weight:700; padding:5px 14px; border-radius:99px;}

/* ============ STEPPER (builder) ============ */
.steps-rail{display:flex; gap:4px; overflow-x:auto;}
.step-pill{flex:0 0 auto; display:flex; align-items:center; gap:9px; padding:10px 14px; border-radius:11px; font-size:13.5px; font-weight:600; color:var(--text-faint); border:1px solid transparent; white-space:nowrap;}
.step-pill .num{width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; background:var(--card); border:1px solid var(--border); flex-shrink:0;}
.step-pill.active{color:var(--text); background:var(--card); border-color:var(--border);}
.step-pill.active .num{background:var(--accent); border-color:var(--accent); color:#fff;}
.step-pill.done .num{background:var(--success); border-color:var(--success); color:#fff;}
.entry-card{border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; background:var(--bg-alt2);}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:640px){.field-grid{grid-template-columns:1fr;}}
.tag{display:inline-flex; align-items:center; gap:7px; background:var(--accent-soft); color:var(--accent2); padding:6px 10px 6px 12px; border-radius:20px; font-size:13px; font-weight:600;}
.tag button{background:none; border:none; color:inherit; opacity:.65; display:flex;}
.tag button:hover{opacity:1;}

/* ============ ATS RING ============ */
.ring-wrap{position:relative; width:88px; height:88px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none; stroke:var(--border); stroke-width:8;}
.ring-fg{fill:none; stroke:url(#ringGrad); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);}
.ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'JetBrains Mono'; font-weight:700;}

/* ============ MISC ============ */
.faq-item{border-bottom:1px solid var(--border); padding:20px 0;}
.faq-item summary{cursor:pointer; font-weight:600; font-size:15.5px; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:14px;}
.faq-item summary::-webkit-details-marker{display:none;}
.faq-item[open] summary .plus{transform:rotate(45deg);}
.faq-item .plus{transition:transform .25s; font-size:20px; color:var(--accent2); flex-shrink:0;}
.faq-item p{margin:12px 0 0; color:var(--text-muted); line-height:1.65; font-size:14.5px;}
.testi-card{padding:24px; border-radius:18px;}
.toast{position:fixed; bottom:24px; right:24px; z-index:500; padding:14px 20px; border-radius:12px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); animation:fadeUp .3s ease;}
.modal-overlay{position:fixed; inset:0; background:rgba(4,7,20,.65); backdrop-filter:blur(4px); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal-box{max-width:560px; width:100%; max-height:88vh; overflow-y:auto; border-radius:20px; padding:28px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th,td{text-align:left; padding:11px 10px; border-bottom:1px solid var(--border);}
th{color:var(--text-faint); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.05em;}
::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
@media print{ body *{visibility:hidden;} }
</style>
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav id="navbar">
  <div class="nav-inner">
    <a href="#" class="logo" onclick="go('home');return false;">
      <span class="logo-mark">R</span> ResumePro <span class="grad-text">AI</span>
    </a>
    <div class="nav-links" id="navLinks">
      <a class="nav-link" data-page="home" onclick="go('home');return false;">Home</a>
      <a class="nav-link" data-page="builder" onclick="go('builder');return false;">Builder</a>
      <a class="nav-link" data-page="templates" onclick="go('templates');return false;">Templates</a>
      <a class="nav-link" data-page="pricing" onclick="go('pricing');return false;">Pricing</a>
      <a class="nav-link" data-page="dashboard" onclick="go('dashboard');return false;">Dashboard</a>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" id="themeBtn"></button>
      <button class="btn btn-primary btn-sm" onclick="go('builder')" style="display:none" id="navCta">Build Resume Now</button>
      <button class="theme-toggle mobile-toggle" onclick="toggleMobileNav()">☰</button>
    </div>
  </div>
  <div id="mobileNav" class="hidden" style="padding:14px 24px; display:flex; flex-direction:column; gap:4px; border-top:1px solid var(--border); margin-top:14px;">
    <a class="nav-link" onclick="go('home');closeMobile();return false;">Home</a>
    <a class="nav-link" onclick="go('builder');closeMobile();return false;">Builder</a>
    <a class="nav-link" onclick="go('templates');closeMobile();return false;">Templates</a>
    <a class="nav-link" onclick="go('pricing');closeMobile();return false;">Pricing</a>
    <a class="nav-link" onclick="go('dashboard');closeMobile();return false;">Dashboard</a>
  </div>
</nav>

<div id="app"></div>

<script>
/* ============================================================
   STATE
=============================================================*/
const LS = {
  get(k,d){try{const v=JSON.parse(localStorage.getItem(k)); return v===null?d:v;}catch(e){return d;}},
  set(k,v){localStorage.setItem(k, JSON.stringify(v));}
};

let theme = LS.get('rp_theme','dark');
let route = 'home';
let currentUser = LS.get('rp_user', null);

const emptyResume = ()=>({
  id: 'r_'+Date.now(),
  template:'modern',
  title:'Untitled Resume',
  updatedAt: Date.now(),
  personal:{fullName:'',jobTitle:'',email:'',phone:'',location:'',linkedin:'',website:'',summary:''},
  education:[],
  skills:[],
  experience:[],
  projects:[],
  certifications:[]
});

let resume = LS.get('rp_active_resume', null) || emptyResume();
let builderStep = 0;
const steps = ['Personal Info','Education','Experience','Skills','Projects','Certifications','Review & Download'];

function saveActive(){ resume.updatedAt = Date.now(); LS.set('rp_active_resume', resume); }

/* ============================================================
   ROUTER
=============================================================*/
function go(page){
  route = page;
  window.scrollTo({top:0,behavior:'instant' in window ? 'auto':'auto'});
  window.scrollTo(0,0);
  render();
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.toggle('active', l.dataset.page===page));
  document.getElementById('navCta').style.display = page==='home' ? '' : 'none';
}
function closeMobile(){document.getElementById('mobileNav').classList.add('hidden');}
function toggleMobileNav(){document.getElementById('mobileNav').classList.toggle('hidden');}

/* ============================================================
   THEME
=============================================================*/
function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').innerHTML = theme==='dark' ? iconSun() : iconMoon();
}
function toggleTheme(){ theme = theme==='dark'?'light':'dark'; LS.set('rp_theme',theme); applyTheme(); }

/* ============================================================
   ICONS (inline svg, minimal line set)
=============================================================*/
const iconSun=()=>`<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>`;
const iconMoon=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>`;
const iconSpark=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>`;
const iconCheck=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>`;
const iconGauge=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M12 21a9 9 0 100-18 9 9 0 000 18z"/><path d="M12 12l4-4M12 12v.01"/></svg>`;
const iconMail=()=>`<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>`;
const iconDownload=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>`;
const iconLayers=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5M3 8l9 5 9-5" opacity="0"/><path d="M3 13.5l9 5 9-5"/></svg>`;
const iconBolt=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>`;
const iconMoonOutline=iconMoon;
const iconUser=()=>`<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>`;
const iconPlus=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>`;
const iconTrash=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>`;
const iconArrowR=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const iconArrowL=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>`;
const iconFile=()=>`<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>`;
const iconLock=()=>`<svg class="icon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>`;

/* ============================================================
   AI CALL — real Claude API w/ heuristic fallback
=============================================================*/
async function callClaude(prompt, {json=false, timeoutMs=15000}={}){
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", signal:controller.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user", content: json ? prompt + "\n\nRespond with ONLY valid JSON, no markdown fences, no preamble." : prompt}]
      })
    });
    clearTimeout(t);
    if(!res.ok) throw new Error('API error');
    const data = await res.json();
    let text = (data.content||[]).map(b=>b.text||'').join('\n').trim();
    if(json){ text = text.replace(/```json|```/g,'').trim(); return JSON.parse(text); }
    return text;
  }catch(e){
    clearTimeout(t);
    return null; // signal fallback
  }
}

function yearsExperience(exp){
  if(!exp.length) return 0;
  let months=0;
  exp.forEach(e=>{
    const s = e.startDate ? new Date(e.startDate+"-01") : null;
    const en = e.current ? new Date() : (e.endDate ? new Date(e.endDate+"-01") : new Date());
    if(s && en) months += Math.max(0,(en.getFullYear()-s.getFullYear())*12 + (en.getMonth()-s.getMonth()));
  });
  return Math.max(1, Math.round(months/12));
}

async function aiAtsScore(jobDesc){
  toast('Analyzing your resume…','loading');
  const p = resume.personal;
  const flatText = [p.summary, resume.experience.map(e=>e.bullets.join(' ')).join(' '), resume.skills.join(' ')].join(' ');
  const prompt = `Act as an ATS (Applicant Tracking System) resume checker. Resume data: Title: ${p.jobTitle}. Summary: ${p.summary}. Skills: ${resume.skills.join(', ')}. Experience bullets: ${resume.experience.map(e=>e.bullets.join('; ')).join(' | ')}. Education: ${resume.education.map(e=>e.degree+' '+e.field).join(', ')}. ${jobDesc?('Target job description: '+jobDesc.slice(0,800)):'No specific job description provided — score general ATS-friendliness.'} Return JSON with keys: score (0-100 integer), strengths (array of up to 4 short strings), improvements (array of up to 4 short actionable strings), missingKeywords (array of up to 6 short strings, [] if none obvious).`;
  let data = await callClaude(prompt, {json:true});
  if(!data){
    // heuristic fallback
    let score = 35;
    const fb = {strengths:[], improvements:[], missingKeywords:[]};
    if(p.summary && p.summary.length>40){score+=12; fb.strengths.push('Clear professional summary present');} else fb.improvements.push('Add a strong 2-3 sentence professional summary');
    if(resume.skills.length>=6){score+=13; fb.strengths.push('Good breadth of listed skills');} else fb.improvements.push('List at least 6-8 relevant skills');
    if(resume.experience.length){score+=15; fb.strengths.push('Work experience section is filled in');
      const bulletCount = resume.experience.reduce((a,e)=>a+e.bullets.length,0);
      if(bulletCount>=resume.experience.length*2){score+=10;} else fb.improvements.push('Add 2-3 achievement bullet points per role');
    } else fb.improvements.push('Add at least one work experience entry');
    if(resume.education.length){score+=8; fb.strengths.push('Education section complete');} else fb.improvements.push('Add your education details');
    if(p.email && p.phone){score+=7;} else fb.improvements.push('Add complete contact information (email & phone)');
    if(jobDesc){
      const jdWords = new Set(jobDesc.toLowerCase().match(/[a-z]{4,}/g)||[]);
      const resWords = new Set(flatText.toLowerCase().match(/[a-z]{4,}/g)||[]);
      const missing = [...jdWords].filter(w=>!resWords.has(w)).slice(0,6);
      fb.missingKeywords = missing;
      const overlap = [...jdWords].filter(w=>resWords.has(w)).length;
      score += Math.min(15, overlap);
    }
    data = {score:Math.min(100,score), strengths:fb.strengths.slice(0,4), improvements:fb.improvements.slice(0,4), missingKeywords:fb.missingKeywords||[]};
  }
  toast('ATS analysis complete ✓','success');
  return data;
}

function toast(msg, type='success'){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el = document.createElement('div');
  el.className='toast glass';
  const color = type==='success'?'var(--success)': type==='error'?'var(--danger)':'var(--accent2)';
  el.style.color = color;
  el.innerHTML = (type==='loading'? `<svg class="icon spin" viewBox="0 0 24 24" style="stroke:${color}"><path d="M21 12a9 9 0 11-9-9"/></svg>` : type==='success' ? `<span style="color:${color}">${iconCheck()}</span>` : `<span style="color:${color}">!</span>`) + `<span style="color:var(--text)">${msg}</span>`;
  document.body.appendChild(el);
  if(type!=='loading') setTimeout(()=>el.remove(), 3400);
  else setTimeout(()=>el.remove(), 1600);
}

function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderResumeDoc(data, tmpl){
  const p = data.personal;
  const contactBits = [p.email,p.phone,p.location,p.linkedin,p.website].filter(Boolean).map(esc).join('  |  ');
  const sec = (title, inner)=> inner ? `<div class="r-section-title">${title}</div>${inner}` : '';
  const expHtml = data.experience.map(e=>`
    <div class="r-entry">
      <div class="r-entry-head"><span>${esc(e.role)||'Role'}${e.company?(' — '+esc(e.company)):''}</span><span>${esc(e.location||'')}</span></div>
      <div class="r-entry-sub"><span>${esc(e.startDate||'')} – ${e.current?'Present':esc(e.endDate||'')}</span></div>
      ${e.bullets && e.bullets.length? '<ul>'+e.bullets.filter(Boolean).map(b=>`<li>${esc(b)}</li>`).join('')+'</ul>':''}
    </div>`).join('');
  const eduHtml = data.education.map(e=>`
    <div class="r-entry">
      <div class="r-entry-head"><span>${esc(e.degree)}${e.field?(' in '+esc(e.field)):''}</span><span>${esc(e.gpa?('GPA '+e.gpa):'')}</span></div>
      <div class="r-entry-sub"><span>${esc(e.school)}</span><span>${esc(e.startDate||'')} – ${esc(e.endDate||'')}</span></div>
    </div>`).join('');
  const projHtml = data.projects.map(pr=>`
    <div class="r-entry">
      <div class="r-entry-head"><span>${esc(pr.name)}</span><span>${esc(pr.tech||'')}</span></div>
      ${pr.description? `<div style="margin-top:2px;">${esc(pr.description)}</div>`:''}
    </div>`).join('');
  const certHtml = data.certifications.map(c=>`
    <div class="r-entry">
      <div class="r-entry-head"><span>${esc(c.name)}</span><span>${esc(c.date||'')}</span></div>
      <div class="r-entry-sub"><span>${esc(c.issuer||'')}</span></div>
    </div>`).join('');
  const skillsHtml = data.skills.length ? `<div class="r-skills">${data.skills.map(s=>`<span class="r-skill-chip">${esc(s)}</span>`).join('')}</div>` : '';

  return `<div class="resume-doc tmpl-${tmpl}">
    <div class="r-header">
      <h1 class="r-name">${esc(p.fullName)||'Your Name'}</h1>
      <div class="r-title">${esc(p.jobTitle)||'Professional Title'}</div>
      <div class="r-contact">${contactBits || 'email@example.com  |  +91 00000 00000  |  City, Country'}</div>
    </div>
    ${sec('Summary', p.summary? `<div>${esc(p.summary)}</div>`:'')}
    ${sec('Experience', expHtml)}
    ${sec('Education', eduHtml)}
    ${sec('Skills', skillsHtml)}
    ${sec('Projects', projHtml)}
    ${sec('Certifications', certHtml)}
  </div>`;
}

async function runAtsCheck(){
  const jd = document.getElementById('jdInput').value;
  const data = await aiAtsScore(jd);
  const resEl = document.getElementById('atsResult');
  if(!resEl) return;
  const color = data.score>=80?'var(--success)': data.score>=55?'var(--warn)':'var(--danger)';
  resEl.innerHTML = `
    <div style="display:flex; align-items:center; gap:18px; margin-bottom:18px;">
      ${ringSvg(data.score,color)}
      <div><div style="font-weight:700; font-size:16px;">${data.score>=80?'Excellent match':data.score>=55?'Good, needs work':'Needs improvement'}</div><div class="muted" style="font-size:13px;">ATS compatibility score</div></div>
    </div>
    ${data.strengths&&data.strengths.length?`<div style="margin-bottom:14px;"><div style="font-weight:700; font-size:13px; color:var(--success); margin-bottom:6px;">Strengths</div>${data.strengths.map(s=>`<div style="font-size:13.5px; margin-bottom:4px; display:flex; gap:8px;"><span style="color:var(--success);">${iconCheck()}</span>${s}</div>`).join('')}</div>`:''}
    ${data.improvements&&data.improvements.length?`<div style="margin-bottom:14px;"><div style="font-weight:700; font-size:13px; color:var(--warn); margin-bottom:6px;">Suggested improvements</div>${data.improvements.map(s=>`<div style="font-size:13.5px; margin-bottom:4px;">• ${s}</div>`).join('')}</div>`:''}
    ${data.missingKeywords&&data.missingKeywords.length?`<div><div style="font-weight:700; font-size:13px; margin-bottom:6px;">Consider adding keywords</div><div style="display:flex; flex-wrap:wrap; gap:6px;">${data.missingKeywords.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div></div>`:''}
  `;
}
function ringSvg(score,color){
  const r=34, c=2*Math.PI*r, off=c-(score/100)*c;
  return `<div class="ring-wrap" style="width:76px;height:76px;">
    <svg width="76" height="76" viewBox="0 0 76 76">
      <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${color}"/><stop offset="100%" stop-color="${color}"/></linearGradient></defs>
      <circle class="ring-bg" cx="38" cy="38" r="${r}"/>
      <circle class="ring-fg" cx="38" cy="38" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>
    <div class="ring-label" style="font-size:16px; color:${color};">${score}</div>
  </div>`;
}

/* ============================================================
   PDF DOWNLOAD
=============================================================*/
async function downloadPdf(){
  toast('Preparing your PDF…','loading');
  const src = document.querySelector('#previewMount .resume-doc') || (()=>{
    const t = document.createElement('div'); t.innerHTML = renderResumeDoc(resume,resume.template); return t.firstElementChild;
  })();
  const clone = src.cloneNode(true);
  clone.style.width='794px';
  const holder = document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-9999px'; holder.style.top='0';
  holder.appendChild(clone);
  document.body.appendChild(holder);
  try{
    const canvas = await html2canvas(clone, {scale:2, backgroundColor:'#ffffff'});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = 210, pageH = 297;
    const imgW = pageW;
    const imgH = canvas.height * imgW / canvas.width;
    let heightLeft = imgH, position = 0;
    const imgData = canvas.toDataURL('image/png');
    pdf.addImage(imgData,'PNG',0,position,imgW,imgH);
    heightLeft -= pageH;
    while(heightLeft > 0){
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData,'PNG',0,position,imgW,imgH);
      heightLeft -= pageH;
    }
    const fname = (resume.personal.fullName||'resume').replace(/[^a-z0-9]+/gi,'_')+'_ResumePro.pdf';
    pdf.save(fname);
    logDownload(fname);
    toast('PDF downloaded ✓','success');
  }catch(err){
    toast('Could not generate PDF, try again','error');
  }finally{
    document.body.removeChild(holder);
  }
}
function logDownload(fname){
  const hist = LS.get('rp_downloads', []);
  hist.unshift({file:fname, resumeTitle:resume.title, date:new Date().toISOString()});
  LS.set('rp_downloads', hist.slice(0,50));
}
function saveResumeToDashboard(){
  const all = LS.get('rp_saved_resumes', []);
  const idx = all.findIndex(r=>r.id===resume.id);
  resume.updatedAt = Date.now();
  if(idx>-1) all[idx]=resume; else all.unshift(resume);
  LS.set('rp_saved_resumes', all);
  toast('Resume saved to Dashboard ✓','success');
}

function pageDashboard(){

          <p class="muted" style="margin:0; font-size:13.5px;">Plan: <strong style="color:var(--accent2)">${currentUser.plan||'Free'}</strong></p>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary btn-sm" onclick="startNewResume()">${iconPlus()} New Resume</button>

      <h3 style="font-size:18px; margin-bottom:14px;">Saved Resumes</h3>
      <div class="card" style="padding:6px 20px; margin-bottom:36px; overflow-x:auto;">
        ${all.length? `<table>
          <tr><th>Title</th><th>Template</th><th>Updated</th><th></th></tr>
          ${all.map(r=>`<tr>
            <td>${esc(r.title||'Untitled')}</td>
            <td>${cap(r.template)}</td>
            <td>${new Date(r.updatedAt).toLocaleDateString()}</td>
            <td style="text-align:right;"><button class="btn btn-soft btn-sm" onclick="openSavedResume('${r.id}')">Open</button>
              <button class="btn btn-ghost btn-sm" onclick="deleteSavedResume('${r.id}')">${iconTrash()}</button></td>
          </tr>`).join('')}
        </table>` : `<div style="padding:30px 0;">${emptyHint('No saved resumes yet — build one and hit Save.')}</div>`}
      </div>

      <h3 style="font-size:18px; margin-bottom:14px;">Download History</h3>
      <div class="card" style="padding:6px 20px; overflow-x:auto;">
        ${downloads.length? `<table>
          <tr><th>File</th><th>Resume</th><th>Date</th></tr>
          ${downloads.map(d=>`<tr><td>${esc(d.file)}</td><td>${esc(d.resumeTitle||'Untitled')}</td><td>${new Date(d.date).toLocaleString()}</td></tr>`).join('')}
        </table>` : `<div style="padding:30px 0;">${emptyHint('No downloads yet.')}</div>`}
      </div>
    </div>
  </section>
  ${footerHtml()}`;
}
function statCard(val,label){
  return `<div class="card" style="padding:20px;"><div class="font-display" style="font-size:26px; font-weight:800;">${val}</div><div class="muted" style="font-size:12.5px; margin-top:4px;">${label}</div></div>`;
}
function startNewResume(){ resume = emptyResume(); saveActive(); builderStep=0; go('builder'); }
function openSavedResume(id){
  const all = LS.get('rp_saved_resumes', []);
  const found = all.find(r=>r.id===id);
  if(found){ resume = found; saveActive(); builderStep=0; go('builder'); }
}
function deleteSavedResume(id){
  let all = LS.get('rp_saved_resumes', []);
  all = all.filter(r=>r.id!==id);
  LS.set('rp_saved_resumes', all);
  toast('Resume deleted','success');
  render();
}

let authMode = 'login';
function dashboardAuth(){
  return `<section class="section" style="padding-top:150px; min-height:80vh; display:flex; align-items:center;">
    <div class="container" style="max-width:420px;">
      <div class="card" style="padding:32px;">
        <div style="text-align:center; margin-bottom:22px;">
          <div class="feat-icon" style="margin:0 auto 14px;">${iconUser()}</div>
          <h2 style="margin:0 0 6px; font-size:22px;">${authMode==='login'?'Log in':'Create your account'}</h2>
          <p class="muted" style="font-size:13.5px; margin:0;">Access your saved resumes and download history.</p>
        </div>
        <div id="authForm">${authMode==='login'?loginForm():signupForm()}</div>
        <p style="text-align:center; font-size:13.5px; margin-top:18px;" class="muted">
          ${authMode==='login'?`New here? <a href="#" onclick="switchAuth('signup');return false;" style="color:var(--accent2); font-weight:600;">Create an account</a>`
          : `Already have an account? <a href="#" onclick="switchAuth('login');return false;" style="color:var(--accent2); font-weight:600;">Log in</a>`}
        </p>
      </div>
      <p class="muted" style="text-align:center; font-size:11.5px; margin-top:14px;">Demo authentication stored locally in your browser. Connect Firebase Authentication for production use.</p>
    </div>
  </section>`;
}
function switchAuth(mode){ authMode=mode; render(); }
function loginForm(){
  return `<div style="display:flex; flex-direction:column; gap:12px;">
    <div><label>Email</label><input id="loginEmail" type="email" placeholder="you@email.com"></div>
    <div><label>Password</label><input id="loginPass" type="password" placeholder="••••••••"></div>
    <button class="btn btn-primary" style="width:100%; margin-top:6px;" onclick="doLogin()">Log In</button>
  </div>`;
}
function signupForm(){
  return `<div style="display:flex; flex-direction:column; gap:12px;">
    <div><label>Full Name</label><input id="suName" placeholder="Your name"></div>
    <div><label>Email</label><input id="suEmail" type="email" placeholder="you@email.com"></div>
    <div><label>Password</label><input id="suPass" type="password" placeholder="Create a password"></div>
    <button class="btn btn-primary" style="width:100%; margin-top:6px;" onclick="doSignup()">Create Account</button>
  </div>`;
}
function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!email||!pass){ toast('Enter email and password','error'); return; }
  const stored = LS.get('rp_users_'+email, null);
  if(!stored || stored.password!==pass){ toast('Invalid credentials (demo: sign up first)','error'); return; }
  currentUser = stored; LS.set('rp_user', currentUser);
  toast('Welcome back ✓','success'); render();
}
function doSignup(){
  const name = document.getElementById('suName').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const pass = document.getElementById('suPass').value;
  if(!name||!email||!pass){ toast('Fill in all fields','error'); return; }
  const user = {name, email, password:pass, plan:'Free'};
  LS.set('rp_users_'+email, user);
  currentUser = user; LS.set('rp_user', user);
  toast('Account created ✓','success'); render();
}
function logout(){ currentUser=null; LS.set('rp_user', null); render(); }

/* ============================================================

=============================================================*/
function render(){
  window.p = { personal: resume.personal };
  const app = document.getElementById('app');
  if(route==='home') app.innerHTML = pageHome();
  else if(route==='builder') app.innerHTML = pageBuilder();
  else if(route==='templates') app.innerHTML = pageTemplates();
  else if(route==='pricing') app.innerHTML = pagePricing();
  else if(route==='dashboard') app.innerHTML = pageDashboard();
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.toggle('active', l.dataset.page===route));
}

/* nav link data-page mapping fix (mobile links reuse same fn) */
document.querySelectorAll('#navLinks .nav-link').forEach(el=>{
  const label = el.textContent.trim().toLowerCase();
  el.dataset.page = label==='home'?'home':label==='builder'?'builder':label==='templates'?'templates':label==='pricing'?'pricing':'dashboard';
});

window.addEventListener('scroll', ()=>{
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY>10);
});

applyTheme();
render();
